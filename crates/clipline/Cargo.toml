[package]
name = "clipline"
version = "0.1.0"
edition = "2021"
description = "Clipline — symmetric LAN clipboard mesh: CLI + tray shell that injects the per-OS clipboard adapter into clipline-core"
license = "MIT"

[[bin]]
name = "clipline"
path = "src/main.rs"

[dependencies]
clipline-core = { path = "../clipline-core" }
# Async runtime for the engine (CONVENTIONS.md). The consumer owns the runtime; core
# does not spin one up. `sync`/`time` back the adapter's channels + render deadline;
# `signal` is the dev runner's Ctrl-C shutdown.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
] }
# Structured logging (tracing-style, CONVENTIONS.md) — the binary installs the
# subscriber; core only emits.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Content fingerprint for same-origin duplicate suppression (LocalCopy.content_hash).
# Already in the tree via clipline-core; matched version.
blake3 = "1"

# Windows clipboard adapter (injected into core; M1). `windows` = Win32 clipboard +
# delayed render + OLE virtual files; `image` = PNG<->DIB codec (PNG-on-wire, SPEC §9).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
# The `#[implement(IDataObject)]` macro expands to `windows_core::…` paths, so this must
# be a direct dependency (version matched to `windows`).
windows-core = "0.61"
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux Wayland clipboard adapter (M-Linux ML.1). **Raw `wayland-client`**, not
# `wl-clipboard-rs`: that crate's copy API takes the bytes up front (`Source::Bytes`/`StdIn`)
# and blocks in its `send` handler, so it cannot serve lazily per request (M-Linux finding;
# PLATFORM-NOTES Finding D). Both data-control protocols are bound: `ext-data-control`
# (KWin — `wayland-protocols` `staging`) and `zwlr-data-control` (wlroots compositors).
# `rustix` gives the poll/pipe/fcntl the dispatch loop and fd-serve need. All pure Rust over
# the system `libwayland-client`-free backend (`wayland-backend` rust impl by default).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["pipe", "event", "fs", "process"] }
# Inbound files (M-Linux ML.2): a read-only FUSE mount whose files stream from the origin on
# read (locked decision #8). Default features = pure-Rust mount through the setuid
# `fusermount3`, no libfuse link — the binary stays one self-contained file (CONVENTIONS.md).
fuser = "0.19"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
